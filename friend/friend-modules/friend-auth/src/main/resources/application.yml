spring:
  application:
    name: friend-auth
  
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

jwt:
  secret: soulmate-jwt-secret-key-2024-production-ready
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.soulmate: DEBUG
    org.springframework.security: DEBUG
