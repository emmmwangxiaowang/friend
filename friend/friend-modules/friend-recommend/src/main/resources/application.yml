spring:
  application:
    name: friend-recommend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
  
  cache:
    type: redis

server:
  port: 8082

recommendation:
  weights:
    interests: 0.4
    traits: 0.2
    location: 0.2
    soul: 0.2
  cache:
    ttl: 3600

logging:
  level:
    com.soulmate: DEBUG
