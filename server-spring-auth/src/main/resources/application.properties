# Server configuration
server.port=8081

# Database (adjust for your environment; defaults to H2 in memory if you swap URL)
# For PostgreSQL compatibility, configure a real Postgres DB in your environment
spring.datasource.url=jdbc:postgresql://localhost:5432/soulmate
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# JWT configuration
jwt.secret=MySuperSecretKeyForJwt12345
jwt.expirationMs=1800000

logging.level.org.springframework=INFO
